<div class="error-page">
  <div class="error-card">
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
      <button class="btn btn--ghost" type="button" (click)="router.navigate(['../'])" *ngIf="code === 403">← Kembali</button>
      <a class="btn btn--primary" routerLink="/rdt/dashboard">Ke Dashboard</a>
    </div>
  </div>
</div>
