<div class="guidance-page">
  <div class="card">
    <p class="intro">
      Pilih fitur untuk membuka panduan penggunaan bergambar (PDF), diambil langsung dari
      tampilan aplikasi yang sesungguhnya.
    </p>

    <div class="accordion">
      <div class="accordion__item" *ngFor="let g of guides" [class.accordion__item--open]="expandedGuideId === g.id">
        <button
          type="button"
          class="accordion__header"
          [attr.aria-expanded]="expandedGuideId === g.id"
          (click)="toggleGuide(g)"
        >
          <span class="accordion__label">{{ g.label }}</span>
          <span class="accordion__chevron">{{ expandedGuideId === g.id ? '▼' : '▶' }}</span>
        </button>

        <div class="accordion accordion--nested" *ngIf="expandedGuideId === g.id">
          <button
            type="button"
            class="accordion__header accordion__header--nested"
            *ngFor="let r of rolesFor(g)"
            (click)="openGuide(g, r)"
          >
            <span class="accordion__label">Panduan {{ g.label }} untuk {{ r }}</span>
            <span class="accordion__chevron">↗</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
