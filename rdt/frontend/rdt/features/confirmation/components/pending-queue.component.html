<!-- Satu tombol per source upload (per file), bukan per-baris. -->
<div class="original-file-downloads" *ngIf="downloadableUploads.length">
  <button
    *ngFor="let u of downloadableUploads"
    class="btn btn--ghost"
    type="button"
    (click)="downloadOriginal.emit({ uploadId: u.upload_id, filename: u.upload_filename })"
  >⬇ Download file asli: {{ u.upload_filename }}</button>
</div>
<div class="table-scroll">
  <table class="rows">
    <thead>
      <tr>
        <th>
          Dinas Pengaju
          <rdt-multi-value-filter placeholder="Tempel banyak Dinas Pengaju sekaligus..." (valuesChange)="onColumnFilterChange('dinas_inisiasi', $event)"></rdt-multi-value-filter>
        </th>
        <!-- Kolom dinamis: 11 kolom kontrak tetap + Notes, sama di semua fitur preview. Notes
             (reviewer_note, BUKAN Remark), "Jika Reject", dan Select All di-pin di ujung kanan
             tabel (lihat .sticky-*-col). -->
        <th *ngFor="let col of previewColumns" [class.rows__num]="col.numeric" [class.sticky-notes-col]="col.key === 'reviewer_note'">
          {{ col.label }}
          <rdt-multi-value-filter [placeholder]="'Tempel banyak ' + col.label + ' sekaligus...'" (valuesChange)="onColumnFilterChange(col.key, $event)"></rdt-multi-value-filter>
        </th>
        <th class="sticky-reject-col">Jika Reject</th>
        <th class="select-all-col sticky-select-col">
          <label class="select-all-label">
            <input type="checkbox" (change)="toggleSelectAll($any($event.target).checked)" />Select All
          </label>
          <!-- Hanya muncul saat ada filter kolom aktif — di luar itu sama saja dengan Select All
               di atas. -->
          <label class="select-all-label" *ngIf="hasActiveFilter">
            <input type="checkbox" (change)="toggleSelectAllFiltered($any($event.target).checked)" />Select yang ke-filter
          </label>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of pagedRows">
        <!-- Badge breadcrumb di atas cuma tampil kalau chain punya >2 hop — baris reassigned di
             queue campuran tetap butuh chain sendiri, per baris. Klik buka popover rincian
             per-hop (table cell gak cukup lebar buat expand ke samping seperti card Dashboard). -->
        <td class="chain-popover-wrap" *ngIf="r.chain && r.chain.length > 2; else plainInisiasi">
          <button type="button" class="chain-cell" [title]="r.chain.join(' → ')" (click)="toggleChainPopover($event, r.id)">
            {{ r.chain.join(' → ') }}
          </button>
          <!-- Bubbling guard only (keeps popover open on inner click), not an interactive control. -->
          <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
          <div
            class="chain-popover"
            *ngIf="isChainPopoverOpen(r.id)"
            [style.top.px]="chainPopoverTop"
            [style.left.px]="chainPopoverLeft"
            (click)="$event.stopPropagation()"
          >
            <rdt-chain-hop-detail [chain]="r.chain" title="Rincian per-hop"></rdt-chain-hop-detail>
          </div>
        </td>
        <ng-template #plainInisiasi><td>{{ r.dinas_inisiasi }}</td></ng-template>
        <ng-container *ngFor="let col of previewColumns">
          <td *ngIf="col.numeric" class="rows__num">{{ getCellValue(r, col.key) | number: '1.2-2' }}</td>
          <td *ngIf="col.key === 'reviewer_note'" class="rows__remark sticky-notes-col" [title]="r.reviewer_note || ''">{{ r.reviewer_note }}</td>
          <td *ngIf="!col.numeric && col.key !== 'reviewer_note'">{{ getCellValue(r, col.key) ?? '—' }}</td>
        </ng-container>
        <td class="sticky-reject-col">
          <select *ngIf="!r.checked" [(ngModel)]="r.redirectTo">
            <option value="">Balik ke pengaju</option>
            <option *ngFor="let d of redirectTargetsFor(r)" [value]="d.code">Ajukan ke {{ d.code }}</option>
          </select>
        </td>
        <td class="select-all-col sticky-select-col"><input type="checkbox" [(ngModel)]="r.checked" /></td>
      </tr>
    </tbody>
  </table>
</div>

<rdt-pagination [page]="page" [totalItems]="filteredRows.length" [pageSize]="pageSize" (pageChange)="onPageChange($event)"></rdt-pagination>
